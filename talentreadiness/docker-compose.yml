services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talentreadiness
      POSTGRES_USER: talentreadiness
      POSTGRES_PASSWORD: talentreadiness
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://talentreadiness:talentreadiness@db:5432/talentreadiness
      SECRET_KEY: local-development-secret
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
